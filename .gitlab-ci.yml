image: node:22

stages:
  - deploy

deploy-pages:
  stage: deploy
  script:
    - npm ci
    # Derive the prefix from the actual Pages URL (unique or project domain).
    - export NEXT_PUBLIC_BASE_PATH="$(node -e 'process.stdout.write(new URL(process.env.CI_PAGES_URL).pathname.replace(/\/$/, ""))')"
    - npm run build:pages
    - test -f out/index.html
    - test -f out/portfolio/index.html
  pages:
    publish: out
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
